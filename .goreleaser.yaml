version: 2

project_name: pomo-tasker

before:
  hooks:
    - go mod tidy
    - go vet ./...
    - go test ./...

builds:
  - id: pomo-tasker
    binary: pomo-tasker
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

changelog:
  sort: asc
  use: github
  format: "{{ .SHA }}: {{ .Message }}{{ with .AuthorUsername }} (@{{ . }}){{ end }}"
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^refactor:"
      - "^style:"
  groups:
    - title: 💥 Breaking Changes
      regexp: '^.*?(\w+(\([[:word:]]+\))?!:).+$'
      order: 0
    - title: 🚀 Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 🐛 Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: 🧹 Others
      order: 999

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - pomo.yaml

homebrew_casks:
  - name: pomo-tasker
    repository:
      owner: Nerver-zip
      name: homebrew-pomo-tasker
    homepage: https://github.com/Nerver-zip/pomo-tasker
    description: A timer-first Pomodoro TUI with persistent task context.
    license: MIT

    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/pomo-tasker"]
          end

nfpms:
  - maintainer: Nerver-zip
    description: A timer-first Pomodoro TUI with persistent task context.
    homepage: https://github.com/Nerver-zip/pomo-tasker
    license: MIT
    formats:
      - deb
      - rpm

release:
  github:
    owner: Nerver-zip
    name: pomo-tasker
  name_template: "v{{.Version}}"
  footer: |
    ## Install

    ### Go
    ```bash
    go install github.com/Nerver-zip/pomo-tasker@latest
    ```

    ### Download Binary
    Download from the assets below for your platform.

    ---
