name: build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: Go Format Check
        run: |
          DIFF=$(gofmt -s -l .)
          if [ -n "$DIFF" ]; then
            echo "The following files are not formatted according to gofmt:"
            echo "$DIFF"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (Race & Coverage)
        run: go test -v -count=1 -race ./...

      - name: Build
        run: go build -v ./...

      - name: Validate GoReleaser Configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Test Multiplatform Cross-Compilation
        run: |
          echo "Checking Linux AMD64 / ARM64 / ARMv7..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -o /dev/null .
          echo "Checking Android ARM64..."
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -o /dev/null .
          echo "Checking macOS Darwin AMD64 / ARM64..."
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o /dev/null .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /dev/null .
          echo "Checking Windows AMD64 / ARM64..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null .
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -o /dev/null .
